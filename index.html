<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title> Clima-Web </title>

</head>
<body>
    <h1> Clima - web </h1>

    <div class="caixa-grande" >

        <input class="input-cidade" placeholder ="digite o nome da cidade"> 

        <button class="lupa" onclick= "cliqueiNoBotao()">

            <img class="img-lupa" alt="lupa" src="https://www.svgrepo.com/show/488200/find.svg">

        </button>

        <div class="caixa-media">

        <h2> tempo em:</h2>

        <p class="temp"> 21°C</p>

        <div class="caixa-menor">

        <img class=" imagem-nuvem" src="https://openweathermap.org/img/wn/04n.png">
        
        <p class="previsao">Nublado</p>

        </div>


        <p class="umidade">Umidade: 32% </p>

    </div>
    
</body>
</html>
